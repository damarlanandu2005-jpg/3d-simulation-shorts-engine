name: kaggle-auth-check

# Manual only. Phase 2: proves the repo secrets can authenticate to Kaggle. No GPU job, no kernel.
# Prints only booleans and "ok"; the token itself is never echoed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --quiet --upgrade kaggle six
          kaggle --version

      - name: Check username secret is present
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: '[ -n "$KAGGLE_USERNAME" ] && echo "KAGGLE_USERNAME present: true" || { echo "KAGGLE_USERNAME present: false"; exit 1; }'

      - name: Select Kaggle auth method (new KGAT_ token or legacy 32-hex key; value never printed)
        env:
          RAW_KAGGLE_SECRET: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$RAW_KAGGLE_SECRET" ]; then echo "::error::KAGGLE_API_TOKEN secret missing"; exit 1; fi
          case "$RAW_KAGGLE_SECRET" in
            KGAT_*) echo "KAGGLE_API_TOKEN=$RAW_KAGGLE_SECRET" >> "$GITHUB_ENV"; echo "auth method: access token (KGAT_)" ;;
            *)      echo "KAGGLE_KEY=$RAW_KAGGLE_SECRET" >> "$GITHUB_ENV"; echo "auth method: legacy username+key" ;;
          esac

      - name: Token shape (diagnostic; never prints the value)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python - <<'PY'
          import os
          t = os.environ.get("KAGGLE_API_TOKEN") or os.environ.get("KAGGLE_KEY", "")
          print("length:", len(t))
          print("starts with KGAT_:", t.startswith("KGAT_"))
          print("has whitespace/newline:", t != t.strip() or any(c.isspace() for c in t))
          print("looks like 32-hex legacy key:", len(t) == 32 and all(c in "0123456789abcdef" for c in t.lower()))
          print("looks like JSON (kaggle.json pasted):", t.lstrip().startswith("{"))
          PY

      - name: Authenticated API call (kaggle datasets list)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if out=$(kaggle datasets list --page-size 1 2>&1); then
            echo "Kaggle authentication OK: API call succeeded"
          else
            echo "Kaggle said:"; echo "$out" | head -15
            echo "::error::Kaggle authentication FAILED"
            exit 1
          fi

      - name: Authenticated kernels API call
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if kaggle kernels list --mine --page-size 1 > /dev/null; then
            echo "Kaggle kernels API reachable with these credentials"
          else
            echo "::error::kernels API call failed (token may lack kernel scope)"
            exit 1
          fi
