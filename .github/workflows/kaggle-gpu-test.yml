name: kaggle-gpu-test

# Manual only. Launches ONE private Kaggle GPU kernel that clones this exact commit and renders either
#   - one of the fixed configs (V1.1 baseline/optix/1080p or an experiment config), or
#   - a validated config path under configs/ (config_path), or
#   - a BATCH of physically different variations of an experiment (batch_variations > 0),
# then downloads the mp4s + benchmark/metadata/QC reports as workflow artifacts. Every input is validated by
# kaggle/kaggle_automation.py; nothing free-form reaches the kernel.
# Run Actions > kaggle-auth-check first.
on:
  workflow_dispatch:
    inputs:
      test_config:
        description: Which V1.1 test to render on a Kaggle GPU
        type: choice
        required: true
        default: baseline
        options:
          - baseline # configs/v1_1_a_baseline.json  720x1280, 16 spp, no denoise
          - optix    # configs/v1_1_b_optix.json      720x1280, 16 spp, OptiX denoise
          - 1080p    # configs/v1_1_c_1080p.json      1080x1920, 16 spp, no denoise
          - multiple_balls # configs/experiments/multiple_balls_100.json
          - ball_funnel    # configs/experiments/ball_funnel_hole.json
          - ring_toss      # configs/experiments/ring_toss_smaller.json
          - cloth_objects  # configs/experiments/cloth_objects_more.json
      config_path:
        description: "Optional: render this repo config instead (e.g. configs/experiments/ring_toss_smaller.json); empty = use test_config"
        type: string
        required: false
        default: ""
      batch_variations:
        description: "Batch mode: number of physically different videos (1-12). 0 = single video"
        type: string
        required: false
        default: "0"
      batch_experiment:
        description: Batch mode - experiment to vary
        type: choice
        required: false
        default: auto
        options:
          - auto
          - curated
          - prototypes # configs/prototypes/*.json: the three creative prototypes in one kernel
          - multiple_balls
          - ball_funnel
          - ring_toss
          - cloth_objects
          - cloth_drape
      batch_seed:
        description: "Batch mode - master seed (integer) or auto (derived from the run id, recorded in the manifest)"
        type: string
        required: false
        default: auto
      preset:
        description: Batch mode - 720p is the fast production preset, 1080p the quality preset
        type: choice
        required: false
        default: 720p
        options:
          - 720p
          - 1080p
      review_run_id:
        description: "Review only: id of an earlier run whose result artifact is inspected (frames printed to the log); nothing is rendered"
        required: false
        default: ""
      accelerator:
        description: Kaggle GPU to request (try another if the kernel stays queued)
        type: choice
        required: true
        default: NvidiaTeslaT4
        options:
          - NvidiaTeslaT4
          - NvidiaTeslaP100
          - NvidiaL4
          - default # no specific GPU; Kaggle picks one

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-test
  cancel-in-progress: false

jobs:
  gpu-test:
    if: ${{ inputs.review_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      TEST_CONFIG: ${{ inputs.test_config }}
      CONFIG_PATH: ${{ inputs.config_path }}
      BATCH_VARIATIONS: ${{ inputs.batch_variations }}
      BATCH_EXPERIMENT: ${{ inputs.batch_experiment }}
      BATCH_SEED: ${{ inputs.batch_seed }}
      PRESET: ${{ inputs.preset }}
      ACCELERATOR: ${{ inputs.accelerator }}
      COMMIT_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the V1.1 code (choose branch v1.1 in "Use workflow from")
        run: |
          [ -f kaggle/kaggle_automation.py ] || { echo "::error::kaggle/kaggle_automation.py not found on this ref. Re-run and select branch v1.1 under 'Use workflow from'."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle six pytest

      - name: Unit tests for the automation helper
        run: python -m pytest -q tests/test_kaggle_automation.py

      - name: Select Kaggle auth method (new KGAT_ token or legacy 32-hex key; value never printed)
        env:
          RAW_KAGGLE_SECRET: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$RAW_KAGGLE_SECRET" ]; then echo "::error::KAGGLE_API_TOKEN secret missing"; exit 1; fi
          case "$RAW_KAGGLE_SECRET" in
            KGAT_*) echo "KAGGLE_API_TOKEN=$RAW_KAGGLE_SECRET" >> "$GITHUB_ENV"; echo "auth method: access token (KGAT_)" ;;
            *)      echo "KAGGLE_KEY=$RAW_KAGGLE_SECRET" >> "$GITHUB_ENV"; echo "auth method: legacy username+key" ;;
          esac

      - name: Fail early if secrets or auth are bad
        run: |
          [ -n "$KAGGLE_USERNAME" ] || { echo "::error::KAGGLE_USERNAME secret missing"; exit 1; }
          kaggle datasets list --page-size 1 > /dev/null || { echo "::error::Kaggle auth failed"; exit 1; }
          echo "Kaggle auth OK"

      - name: Prepare kernel (fixed config mapping, pinned commit)
        id: prep
        run: |
          ARGS=()
          if [ "${BATCH_VARIATIONS:-0}" != "0" ]; then
            SEED="$BATCH_SEED"; if [ "$SEED" = auto ]; then SEED=$(( RUN_ID % 1000000 )); fi
            ARGS+=(--batch-experiment "$BATCH_EXPERIMENT" --batch-variations "$BATCH_VARIATIONS" --batch-seed "$SEED" --preset "$PRESET")
          elif [ -n "$CONFIG_PATH" ]; then
            ARGS+=(--config-path "$CONFIG_PATH")
          fi
          KERNEL=$(python kaggle/kaggle_automation.py prepare \
            --test-config "$TEST_CONFIG" --sha "$COMMIT_SHA" \
            --username "$KAGGLE_USERNAME" --run-id "$RUN_ID" --accelerator "$ACCELERATOR" --out kaggle_job \
            --job-file job.json "${ARGS[@]}")
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "Prepared $KERNEL for commit $COMMIT_SHA, test_config=$TEST_CONFIG"

      - name: Push kernel to Kaggle (starts the GPU run)
        env:
          KERNEL: ${{ steps.prep.outputs.kernel }}
        run: |
          set -o pipefail
          if [ "$ACCELERATOR" = default ]; then ACC=(); else ACC=(--accelerator "$ACCELERATOR"); fi
          kaggle kernels push -p kaggle_job "${ACC[@]}" 2>&1 | tee push.log
          if grep -qi "error" push.log; then
            echo "::error::kaggle kernels push reported an error"; exit 1
          fi
          echo "Kernel pushed: https://www.kaggle.com/code/$KERNEL"

      - name: Wait for the kernel to finish
        env:
          KERNEL: ${{ steps.prep.outputs.kernel }}
        run: python kaggle/kaggle_automation.py wait --kernel "$KERNEL" --timeout 12600 --interval 60 --max-queue 1500

      - name: Download kernel output (also when the run failed, for diagnosis)
        if: always() && steps.prep.outputs.kernel != ''
        env:
          KERNEL: ${{ steps.prep.outputs.kernel }}
        run: |
          mkdir -p kaggle_out
          kaggle kernels output "$KERNEL" -p kaggle_out -o || echo "::warning::could not download kernel output"
          find kaggle_out -type f | head -50

      - name: Show kernel run_info (errors and tails are printed here)
        if: always() && steps.prep.outputs.kernel != ''
        run: |
          f=$(find kaggle_out -name run_info.json | head -1)
          [ -n "$f" ] && cat "$f" || echo "no run_info.json downloaded (kernel died before writing it)"

      - name: Verify videos, benchmark/metadata/QC files and run_info.json
        run: |
          # kernel writes /kaggle/working/result/*; the CLI may keep that subfolder
          DIR=kaggle_out; [ -d kaggle_out/result ] && DIR=kaggle_out/result
          python kaggle/kaggle_automation.py verify --job-file job.json --dir "$DIR"
          echo "RESULT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Show benchmark summary (also in the run summary page)
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          d = os.environ["RESULT_DIR"]
          info = json.load(open(f"{d}/run_info.json"))
          print(f"### kaggle-gpu-test: {info.get('test_config')} @ {info.get('commit', '')[:7]}")
          print("run_info:", json.dumps({k: info.get(k) for k in ("gpu", "bpy", "wall_seconds", "video_bytes", "status", "batch", "batch_status")}))
          if os.path.isfile(f"{d}/benchmark.json"):
              print("summary:", json.dumps(json.load(open(f"{d}/benchmark.json")).get("summary"), indent=1))
              if os.path.isfile(f"{d}/qc_report.json"):
                  qc = json.load(open(f"{d}/qc_report.json")); print("QC passed:", qc["passed"])
          else:
              m = json.load(open(f"{d}/manifest.json"))
              for it in m["items"]:
                  print(f"- {it['name']}: {it['status']} qc={it.get('qc_passed')} {it.get('seconds')}s changed={it['changed']}")
          PY

      - name: Inspect final video streams (audio present? durations)
        run: |
          set -eo pipefail
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for mp4 in $(find "$RESULT_DIR" -name "*.mp4" | sort); do
            echo "video file: $mp4"
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,duration -of compact "$mp4" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          python - <<'PY'
          import json, os
          p = os.environ["RESULT_DIR"] + "/benchmark.json"
          if os.path.isfile(p):
              kinds = [j["kind"] for j in json.load(open(p))["jobs"]]
              print("job kinds:", {k: kinds.count(k) for k in dict.fromkeys(kinds)})
              print("card jobs present:", "card_render" in kinds, "| audio mix job present:", "audio" in kinds)
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-${{ inputs.test_config }}-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error

      - name: Print contact sheets of the final videos (visual review from the job log)
        # Plain log output, no extra permissions: 12 evenly spaced frames of each FINAL mp4 as one base64 JPEG per video,
        # so the real rendered pixels can be inspected after the run (not only ffprobe/QC).
        run: |
          set -euo pipefail
          DIR=kaggle_out; [ -d kaggle_out/result ] && DIR=kaggle_out/result
          for mp4 in $(find "$DIR" -mindepth 2 -maxdepth 2 -name '*.mp4' ! -name '*_silent.mp4' ! -name 'hook.mp4'); do
            name=$(basename "$mp4" .mp4)
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
            ffmpeg -v error -y -i "$mp4" -vf "fps=12/${dur},scale=240:-2,tile=6x2" -frames:v 1 -q:v 5 "$RUNNER_TEMP/$name.jpg"
            echo "CONTACT_SHEET_BEGIN $name duration=$dur"
            base64 -w 0 "$RUNNER_TEMP/$name.jpg"; echo
            echo "CONTACT_SHEET_END $name"
            ffmpeg -v error -y -ss "$(python3 -c "print(max(0,$dur-4.0))")" -i "$mp4" -vf "fps=2,scale=270:-2,tile=4x2" -frames:v 1 -q:v 3 "$RUNNER_TEMP/${name}_end.jpg"
            echo "CONTACT_SHEET_BEGIN ${name}_end duration=$dur"
            base64 -w 160 "$RUNNER_TEMP/${name}_end.jpg"
            echo "CONTACT_SHEET_END ${name}_end"
            ffmpeg -v error -y -t 2.4 -i "$mp4" -vf "fps=2.5,scale=270:-2,tile=6x1" -frames:v 1 -q:v 3 "$RUNNER_TEMP/${name}_start.jpg"
            echo "CONTACT_SHEET_BEGIN ${name}_start duration=$dur"
            base64 -w 160 "$RUNNER_TEMP/${name}_start.jpg"
            echo "CONTACT_SHEET_END ${name}_start"
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-${{ inputs.test_config }}-${{ github.run_id }}-diagnostics
          path: |
            kaggle_out
            push.log
          if-no-files-found: ignore

  review:
    if: ${{ inputs.review_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the earlier run's result artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}
          path: review_in
      - name: Print contact sheets and key frames of the final videos (log output, folded base64 JPEG)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for mp4 in $(find review_in -name '*.mp4' ! -name '*_silent.mp4' ! -name 'hook.mp4' ! -path '*/stage_*'); do
            name=$(basename "$mp4" .mp4)
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
            ffmpeg -v error -y -i "$mp4" -vf "fps=18/${dur},scale=216:-2,tile=6x3" -frames:v 1 -q:v 4 "$RUNNER_TEMP/$name.jpg"
            echo "CONTACT_SHEET_BEGIN $name duration=$dur"
            base64 -w 160 "$RUNNER_TEMP/$name.jpg"
            echo "CONTACT_SHEET_END $name"
          done
